version: "3.9"

services:
  kanak-db:
    image: postgres:16-alpine
    container_name: kanak-postgres
    restart: always
    environment:
      POSTGRES_USER: kanak_user
      POSTGRES_PASSWORD: ${KANAK_DB_PASSWORD:?Set KANAK_DB_PASSWORD in a private environment file}
      POSTGRES_DB: kanak_db
    volumes:
      - kanak_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanak_user -d kanak_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  kanak-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kanak-api
    restart: always
    depends_on:
      kanak-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://kanak_user:${KANAK_DB_PASSWORD:?Set KANAK_DB_PASSWORD in a private environment file}@kanak-db:5432/kanak_db
      BAHRAIN_VAT_RATE: "0.100"
    ports:
      - "8000:8000"

volumes:
  kanak_pgdata:
