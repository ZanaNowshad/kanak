name: KANAK Android verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager unavailable" >&2; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Compile, unit test and assemble
        run: gradle :app:compileDebugKotlin :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Publish debug APK for review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kanak-review-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q backend
      - name: Run backend unit tests
        run: python -m pytest backend/tests -q
